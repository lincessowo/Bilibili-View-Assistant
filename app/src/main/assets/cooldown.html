<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>冷却中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F1220;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 30% 20%,#00A1D615 0%,transparent 60%),radial-gradient(ellipse 500px 500px at 90% 80%,#FB729915 0%,transparent 60%);pointer-events:none}
.wrap{display:flex;align-items:center;justify-content:center;gap:36px;max-width:560px;width:100%;position:relative;z-index:1}
.card-glass{background:linear-gradient(135deg,#1E2648E6 0%,#1A1E32E6 100%);border:1px solid #FFFFFF14;border-radius:24px;padding:28px;backdrop-filter:blur(20px);display:flex;align-items:center;gap:32px;width:100%;box-shadow:0 20px 60px #00000040,0 0 0 1px #FFFFFF08 inset}
.circle{width:148px;height:148px;border-radius:50%;background:#0F1220;border:1px solid #FFFFFF0F;display:flex;justify-content:center;align-items:center;position:relative;flex-shrink:0;box-shadow:0 8px 32px #00000040,inset 0 1px 0 #FFFFFF0F}
.circle::before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px dashed #FFFFFF0A}
.circle svg{position:absolute;top:-4px;left:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg)}
.circle svg circle{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.bg-ring{stroke:#FFFFFF0F}
.fg-ring{stroke:url(#grad)}
.num{font-size:54px;font-weight:800;color:#fff;letter-spacing:-0.04em;text-shadow:0 2px 20px #00A1D640}
.num small{font-size:14px;font-weight:600;color:#FFFFFF60;letter-spacing:0.08em;margin-top:2px;display:block;text-align:center}
.txt{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;background:#FB729915;border:1px solid #FB729930;color:#FB7299;border-radius:100px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px}
.badge i{width:6px;height:6px;background:#FB7299;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.85)}}
h2{font-size:19px;font-weight:700;letter-spacing:-0.02em;margin-bottom:10px;color:#fff;line-height:1.3}
p{font-size:13px;color:#9AA1C0;line-height:1.65;margin-bottom:8px}
p b{color:#FFFFFFD9;font-weight:600}
.progress{height:3px;background:#FFFFFF0F;border-radius:100px;margin-top:16px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#00A1D6,#FB7299);border-radius:100px;transition:width 1s linear;width:100%}
.tag-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{font-size:11px;color:#9AA1C0;background:#FFFFFF08;border:1px solid #FFFFFF0F;border-radius:100px;padding:5px 10px}
@media (max-width:640px){
  body{padding:16px;align-items:flex-start;padding-top:20px}
  .card-glass{flex-direction:column;text-align:center;padding:24px 20px;gap:22px}
  .txt{text-align:center}
  .circle{width:132px;height:132px}
  .num{font-size:48px}
  h2{font-size:17px}
  p{font-size:12.5px}
  .tag-row{justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card-glass">
    <div class="circle">
      <svg viewBox="0 0 160 160">
        <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00A1D6"/><stop offset="100%" stop-color="#FB7299"/></linearGradient></defs>
        <circle class="bg-ring" cx="80" cy="80" r="72"/>
        <circle id="ring" class="fg-ring" cx="80" cy="80" r="72"/>
      </svg>
      <div style="text-align:center;position:relative;z-index:1">
        <div class="num" id="cd">30<small>SECONDS</small></div>
      </div>
    </div>
    <div class="txt">
      <div class="badge"><i></i> 冷却进行中</div>
      <h2>请勿关闭，正在养号冷却</h2>
      <p>每次访问后需 <b>冷却 30 秒</b> 并清除痕迹，使下一次访问被视为 <b>独立新访客</b>。</p>
      <p>若跳过冷却，B站会判定为重复访问，<b>不计入播放量</b>。</p>
      <div class="progress"><i id="bar"></i></div>
      <div class="tag-row"><span class="tag">✓ Cookie 已清除</span><span class="tag">✓ UA 已轮换</span></div>
    </div>
  </div>
</div>
<script>
var s=30,total=30,c=document.getElementById('cd'),r=document.getElementById('ring'),bar=document.getElementById('bar'),
    L=2*Math.PI*72;
r.style.strokeDasharray=L;
r.style.strokeDashoffset=0;
function tick(){
  if(s<=0){c.innerHTML='0<small>DONE</small>';return}
  s--;
  c.innerHTML=s+'<small>SECONDS</small>';
  r.style.strokeDashoffset=L*(1-s/total);
  bar.style.width=(s/total*100)+'%';
  setTimeout(tick,1000);
}
setTimeout(tick,1000);
</script>
</body>
</html>
